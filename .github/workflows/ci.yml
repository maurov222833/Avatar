name: Avatar CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

jobs:
  hermetic:
    name: Hermetic suite (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime + test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run hermetic suite
        env:
          # Never pick up a host key; provider unit tests inject their own fakes.
          GEMINI_API_KEY: ""
          OPENAI_API_KEY: ""
          GROQ_API_KEY: ""
        run: |
          # Browser / desktop automation are optional on Linux CI (F-22).
          # Unittest.skip* is enough for pyautogui; exclude the Chromium suite by path.
          pytest tests/ -q \
            --ignore=tests/test_browser_engine.py \
            --tb=line
