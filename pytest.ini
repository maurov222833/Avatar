[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .pytest_cache scratch __pycache__ memory b: assets
addopts = -p no:cacheprovider
markers =
    browser: needs Chromium / local browser fixture
    desktop: needs Windows GUI automation (pyautogui)
    live_provider: hits a real network LLM provider
